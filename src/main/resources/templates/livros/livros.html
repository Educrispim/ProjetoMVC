<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            background-color: white;
        }
    </style>
    <title>Biblioteca</title>
</head>
<body>
<h1>Lista de Livros</h1>
<ul>
    <li th:text="${livro.titulo}"></li>
</ul>

<form th:object="${livro}" th:action="@{/livros}" method="post">
    <input type="text" th:field="*{titulo}" placeholder="Título">
    <input type="text" th:field="*{autor}" placeholder="Autor">
    <input type="text" th:field="*{isbn}" placeholder="ISBN">
    <button type="submit">Cadastrar</button>
</form>
<a href="/inicio">Voltar para a página inicial</a>
</body>
</html>
